# Configuración del Sistema de Emergencia WRO

# Modo de operación
modo: "abierto"  # "abierto" para main.py (reto abierto), "obstaculos" para main_obstaculos.py (reto de obstáculos)

# Configuración de hardware compartida
hardware:
  pin_boton_inicio: 17  # GPIO 17 (Pin físico 11) - Compartido con sistema principal
  pin_servo_lidar: 18  # GPIO para servo del LiDAR (usado en main_obstaculos.py)

# Conexiones seriales
serial:
  puerto_lidar: "/dev/serial0"
  baud_lidar: 115200
  baud_arduino: 115200

# Parámetros de navegación compartidos
navegacion:
  vueltas_objetivo: 3
  esquinas_por_vuelta: 4
  frecuencia_control_hz: 40

# Velocidades compartidas (-100 a 100)
velocidades:
  crucero: 65        # Velocidad en tramos rectos
  giro: 35          # Velocidad durante giros de esquina (reducida de 45)
  esquiva: 30       # Velocidad durante esquiva (reducida de 40)

# Ángulos de dirección del carro compartidos (valores Arduino)
angulos_direccion:
  recto: 90
  giro_derecha: 10   # Giro máximo derecha (aumentado a 10 para máximo giro)
  giro_izquierda: 170 # Giro máximo izquierda (aumentado a 170 para máximo giro)

# Umbrales de distancia LiDAR (en cm)
lidar:
  distancia_giro_cm: 85.0        # Distancia frontal para iniciar giro de esquina (aumentado de 75 a 85)
  distancia_obstaculo_cm: 50.0  # Distancia frontal para detectar obstáculo (main_obstaculos.py)
  distancia_despejada_cm: 110.0 # Distancia a la que se considera la pista despejada

# Tiempos de control
tiempos:
  duracion_max_giro_seg: 2.0      # Tiempo máximo de giro forzado por esquina (aumentado de 1.6)
  duracion_min_giro_seg: 0.8      # Tiempo mínimo forzado con dirección a la derecha (aumentado de 0.5)
  cooldown_esquina_seg: 1.4       # Tiempo mínimo entre detección de esquinas
  duracion_esquiva_seg: 1.2       # Tiempo máximo con dirección de esquiva aplicada (aumentado de 0.8)
  duracion_min_esquiva_seg: 0.5   # Tiempo mínimo de esquiva forzado (aumentado de 0.3)

# Ángulos del servo LiDAR (para main_obstaculos.py) - Rango máximo 0-180°
servo_lidar:
  angulo_frente: 90     # LiDAR mirando al frente
  angulo_izquierda: 0   # LiDAR mirando a la izquierda (máximo rango)
  angulo_derecha: 180   # LiDAR mirando a la derecha (máximo rango)
  ms_por_grado: 5       # ~5 ms/grado para barrido rápido

# Configuración de cámara CSI (para main_obstaculos.py)
camara:
  enabled: true                    # Habilitar/deshabilitar cámara
  width: 640                       # Resolución horizontal
  height: 480                      # Resolución vertical
  fps: 30                          # Frames por segundo objetivo
  buffer_size: 2                   # Tamaño del buffer de frames (mantiene los más recientes)

# Configuración de detección de colores (para main_obstaculos.py)
colores:
  enabled: true                    # Habilitar/deshabilitar detección de colores
  region_interes:                  # Región de interés [x1, y1, x2, y2] (centro de la imagen)
    x1: 160
    y1: 120
    x2: 480
    y2: 360
  area_minima: 500                 # Área mínima en píxeles para considerar detección válida
  confianza_minima: 0.3             # Proporción mínima de píxeles del color en la región
  
  # Rangos HSV para detección de colores (H: 0-180, S: 0-255, V: 0-255)
  rojo:
    h_min: 0
    h_max: 10
    s_min: 100
    s_max: 255
    v_min: 50
    v_max: 255
  
  verde:
    h_min: 40
    h_max: 80
    s_min: 50
    s_max: 255
    v_min: 50
    v_max: 255
  
  morado:
    h_min: 130
    h_max: 160
    s_min: 50
    s_max: 255
    v_min: 50
    v_max: 255
